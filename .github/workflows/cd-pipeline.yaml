name: CD - Build & Deploy Pipeline

on:
  push:
    branches:
      - "develop"
      - "release/*"
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/family-heritage-backend
  IMAGE_FRONTEND: ${{ github.repository }}/family-heritage-frontend
  GITOPS_REPO: musmike/family-heritage-gitops

jobs:
  build-and-publish:
    name: Build & Publish Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_tag: ${{ steps.meta_backend.outputs.version }} 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata Backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=sha,format=short,prefix=dev-,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=rc-,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=semver,pattern={{version}}

      - name: Docker Metadata Frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=sha,format=short,prefix=dev-,enable=${{ github.ref == 'refs/heads/develop' }}
            type=sha,format=short,prefix=rc-,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=semver,pattern={{version}}

      - name: Security Scan (Trivy FS - All Repo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          pull: true
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Scan (Trivy Image - Backend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta_backend.outputs.version }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          pull: true
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Security Scan (Trivy Image - Frontend)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}:${{ steps.meta_frontend.outputs.version }}
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  deploy-dev:
    name: Update Gitops (Dev)
    needs: build-and-publish
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitOps Repo
        uses: ./.github/actions/update-gitops
        with:
          environment: 'dev'
          image_tag: ${{ needs.build-and-publish.outputs.image_tag }}
          gitops_repo: ${{ env.GITOPS_REPO }}
          app_id: ${{ secrets.GITOPS_APP_ID }}
          private_key: ${{ secrets.GITOPS_PRIVATE_KEY }}
          
  deploy-staging:
    name: Update Gitops (Staging)
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitOps Repo
        uses: ./.github/actions/update-gitops
        with:
          environment: 'staging'
          image_tag: ${{ needs.build-and-publish.outputs.image_tag }}
          gitops_repo: ${{ env.GITOPS_REPO }}
          app_id: ${{ secrets.GITOPS_APP_ID }}
          private_key: ${{ secrets.GITOPS_PRIVATE_KEY }}

  deploy-prod:
    name: Update Gitops (Production)
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: 
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Update GitOps Repo
        uses: ./.github/actions/update-gitops
        with:
          environment: 'prod'
          image_tag: ${{ needs.build-and-publish.outputs.image_tag }}
          gitops_repo: ${{ env.GITOPS_REPO }}
          app_id: ${{ secrets.GITOPS_APP_ID }}
          private_key: ${{ secrets.GITOPS_PRIVATE_KEY }}